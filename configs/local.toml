# Enforced by scripts/run_local.py, before importing numerical libraries.
[resources]
cpu_threads = 1
nice = 15
address_space_mib = 6144
resident_memory_mib = 3072
# One low-priority CPU remains the concurrency cap. A difficult accepted
# nonlinear increment may need longer without increasing machine load.
wall_seconds = 660
cpu_seconds = 600
run_disk_mib = 128
file_size_mib = 64
minimum_available_memory_mib = 8192
maximum_load_per_cpu = 0.75
gpu_enabled = false

[gpu]
device = 0
maximum_process_memory_mib = 8192
minimum_free_memory_mib = 4096
maximum_start_utilization_percent = 40
duty_cycle = 0.20
pool_memory_mib = 7168

[research]
seed = 20261124
precision = "float64"
stage = "sparse-coupled-scaling"

