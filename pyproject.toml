[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morqex-research"
version = "0.0.5"
description = "Evidence-first microstructure electro-chemo-mechanics research"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "scipy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=8"]
geometry = ["scikit-image>=0.24", "tifffile", "meshio", "matplotlib", "PyYAML", "edt"]
ai = ["torch>=2.7", "diffusers>=0.35", "pillow", "opencv-python", "scikit-learn"]
simulation = ["ngsolve>=6.2", "pybamm>=25.1"]
transport = ["taufactor"]
view = ["pyvista", "plotly"]

[project.scripts]
morqex = "morqex.microstructure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["morqex*"]

[tool.setuptools.package-data]
"*" = ["*.pyx", "*.pxd", "*.h", "*.H", "*.hpp", "*.cxx", "*.cpp", "*.yaml", "*.inputs", "CMakeLists.txt", "pyproject.toml", "LICENSE", "provenance.json", "inputs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

