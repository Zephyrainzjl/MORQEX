<main><small>0.0.7 · 本地实测 · 源码与结果分离 · 2026-11-25</small><h1>MORQEX · 微结构 ⇄ DFN</h1><p>非均匀状态演化、双向热—电化学—力学端口与按需局部场恢复</p><!-- CONTENT --></main>
<script id="viewer-data" type="application/json">/* VIEWER_DATA */</script>
<script id="viewer-code">
const DATA=JSON.parse(document.getElementById('viewer-data').textContent);
const el=id=>document.getElementById(id);
for(const name of Object.keys(DATA)){const opt=document.createElement('option');opt.value=name;opt.textContent=name;el('case').appendChild(opt)}
function fields(m,ti,xi,T){
 const c=m.c[xi][ti],q=[m.strain[xi][ti],...c.map(v=>v-m.reference),T-298.15];
 const values=[];for(let i=0;i<m.P.length;i++){
  const ci=m.P[i].reduce((s,v,k)=>s+v*c[k],0);
  const s=m.S[i].map(row=>row.reduce((v,h,k)=>v+h*q[k],0));
  const vm=Math.sqrt(Math.max(0,((s[0]-s[1])**2+(s[1]-s[2])**2+(s[2]-s[0])**2)/2+1.5*(s[3]**2+s[4]**2+s[5]**2)));
  values.push({soc:ci/m.cmax,xx:s[0]/1e6,vm:vm/1e6,mu:-m.omega*(s[0]+s[1]+s[2])/3});
 }return values;
}
function draw(){
 const d=DATA[el('case').value],m=d.micro[el('domain').value];
 el('time').max=d.time.length-1;el('depth').max=m.shape[0]-1;
 const ti=Math.min(+el('time').value,d.time.length-1),z=Math.min(+el('depth').value,m.shape[0]-1),xi=+el('macro').value;
 const values=fields(m,ti,xi,d.temperature[ti]),key=el('field').value;
 const layer=[];for(let i=0;i<m.ids.length;i++){const id=m.ids[i];if(Math.floor(id/(m.shape[1]*m.shape[2]))===z)layer.push({id,v:values[i][key]})}
 let lo=Math.min(...values.map(v=>v[key])),hi=Math.max(...values.map(v=>v[key]));if(hi-lo<1e-12)hi=lo+1e-12;
 const ctx=el('map').getContext('2d');ctx.clearRect(0,0,720,390);const size=Math.min(320/m.shape[1],520/m.shape[2]),ox=36,oy=30;
 ctx.fillStyle='#d9dfe3';ctx.fillRect(ox,oy,m.shape[2]*size,m.shape[1]*size);
 for(const item of layer){const p=(item.v-lo)/(hi-lo);ctx.fillStyle=`hsl(${235-235*p},72%,52%)`;ctx.fillRect(ox+(item.id%m.shape[2])*size+1,oy+(Math.floor(item.id/m.shape[2])%m.shape[1])*size+1,size-2,size-2)}
 ctx.fillStyle='#183044';ctx.font='14px sans-serif';ctx.fillText(`min ${lo.toPrecision(5)} / max ${hi.toPrecision(5)}`,400,45);ctx.fillText(`Z = ${z} · ${m.P.length} active voxels`,400,75);
 const jv=m.area.reduce((sum,a,k)=>sum+a*m.j[xi][ti][k],0),direct=m.jv[xi][ti];
 el('readout').textContent=`t=${d.time[ti].toFixed(1)} s | V=${d.voltage[ti].toFixed(5)} V | T=${d.temperature[ti].toFixed(3)} K | Σ Aᵣjᵣ=${jv.toPrecision(7)} A/m³ | DFN jᵥ=${direct.toPrecision(7)} A/m³ | 差=${Math.abs(jv-direct).toExponential(2)} A/m³`;
}
for(const id of ['case','domain','macro','field','time','depth'])el(id).addEventListener('input',draw);
draw();
</script></html>
