<main><small>0.0.8 · 本地单核受限实测 · 2026-11-25</small><h1>MORQEX · 分相CBD与退化跨尺度闭环</h1><p>真实CT来源 · 变化界面算子 · SEI与金属锂库存 · 可恢复演化场</p><!-- CONTENT --></main>
<script id="viewer-data" type="application/json">/* VIEWER_DATA */</script>
<script id="viewer-code">
const DATA=JSON.parse(document.getElementById('viewer-data').textContent),el=id=>document.getElementById(id);
for(const name of Object.keys(DATA)){const o=document.createElement('option');o.value=name;o.textContent=name;el('case').appendChild(o)}
function draw(){const d=DATA[el('case').value],m=d.micro[el('domain').value],key=el('field').value;el('time').max=d.time.length-1;el('depth').max=m.shape[0]-1;
 const ti=Math.min(+el('time').value,d.time.length-1),xi=+el('macro').value,z=Math.min(+el('depth').value,m.shape[0]-1),v=m.fields[key][xi][ti];
 const whole=m.fields[key].flat(2);let lo=Infinity,hi=-Infinity;for(const row of whole){for(const x of Array.isArray(row)?row:[row]){lo=Math.min(lo,x);hi=Math.max(hi,x)}}if(hi-lo<1e-15)hi=lo+1e-15;
 const ctx=el('map').getContext('2d');ctx.clearRect(0,0,760,390);const size=Math.min(320/m.shape[1],510/m.shape[2]),ox=30,oy=30;
 for(let y=0;y<m.shape[1];y++)for(let x=0;x<m.shape[2];x++){const i=z*m.shape[1]*m.shape[2]+y*m.shape[2]+x,p=m.labels[i];
  ctx.fillStyle=p===0?'#dce2e7':p===2?'#b28a5e':'#659786';if((key==='vm'&&p!==0)||(p===1&&key!=='vm'))ctx.fillStyle=`hsl(${235-235*(v[i]-lo)/(hi-lo)},72%,52%)`;
  ctx.fillRect(ox+x*size+1,oy+y*size+1,size-2,size-2)}
 ctx.fillStyle='#183044';ctx.font='14px sans-serif';ctx.fillText(`全时域 min ${lo.toPrecision(5)} / max ${hi.toPrecision(5)}`,350,45);ctx.fillText(`Z=${z} | ${m.active_voxels} active voxels → ${m.regions} regions`,350,75);
 el('readout').textContent=`t=${d.time[ti].toFixed(2)} s | V=${d.voltage[ti].toFixed(5)} V | T=${d.temperature[ti].toFixed(3)} K | 界面位移跳量P99=${m.opening_P99_nm[xi][ti].toPrecision(5)} nm。滑块重放真实求解轨迹；新负载须由Python求解核积分。`;
}
for(const id of ['case','domain','macro','field','time','depth'])el(id).addEventListener('input',draw);draw();
</script></html>
