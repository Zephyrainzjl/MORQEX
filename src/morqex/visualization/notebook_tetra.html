<!doctype html><html><meta charset="utf-8"><style>body{font:14px system-ui;margin:16px;color:#234052;background:#f1f6f8}canvas{width:100%;height:470px;background:white;touch-action:none;border-radius:8px}label{margin-right:16px}input{accent-color:#166a73}</style>
<main><h3 id="title"></h3><p id="info"></p><label>Shrink / 收缩显示 <input id="shrink" type="range" min="0.45" max="1" step=".01" value=".92"></label><label>Opacity / 不透明度 <input id="alpha" type="range" min=".03" max="1" step=".01" value=".16"></label><canvas id="mesh"></canvas><p>Actual tetrahedral subset, SI coordinates. Display shrink does not change mesh data. / 真实四面体子集，收缩只用于显示。</p>
</main><script>const D=__DATA__,$=id=>document.getElementById(id);let yaw=-.65,pitch=.55,drag=null,queued=false;const lo=[0,1,2].map(a=>Math.min(...D.points.map(p=>p[a]))),hi=[0,1,2].map(a=>Math.max(...D.points.map(p=>p[a]))),centre=lo.map((x,a)=>(x+hi[a])/2),extent=Math.hypot(...hi.map((x,a)=>x-lo[a]));const pattern=[[1,2,3],[0,3,2],[0,1,3],[0,2,1]];$('title').textContent=D.title;$('info').textContent=`${D.sampling==='uniform'?D.cells.length+' actual cells sampled across mesh':'Cells '+D.first+'..'+(D.first+D.cells.length-1)} / ${D.total.toLocaleString()} total · XYZ metres · drag to rotate`;
function rot(p){let a=Math.cos(yaw)*p[0]-Math.sin(yaw)*p[1],b=Math.sin(yaw)*p[0]+Math.cos(yaw)*p[1];return [a,Math.sin(pitch)*b-Math.cos(pitch)*p[2],Math.cos(pitch)*b+Math.sin(pitch)*p[2]];}
function draw(){const canvas=$('mesh'),r=canvas.getBoundingClientRect(),d=Math.min(1.5,devicePixelRatio||1);canvas.width=r.width*d;canvas.height=r.height*d;const c=canvas.getContext('2d');c.scale(d,d);const scale=Math.min(r.width,r.height)*1.05/extent,s=+$('shrink').value;let faces=[];for(let i=0;i<D.cells.length;i++){let vertices=D.cells[i].map(k=>D.points[k]),mean=[0,1,2].map(a=>vertices.reduce((t,p)=>t+p[a],0)/4),p=vertices.map(q=>rot(q.map((v,a)=>mean[a]+s*(v-mean[a])-centre[a])));for(let f of pattern)faces.push({p:f.map(k=>p[k]),phase:D.phase[i],z:f.reduce((t,k)=>t+p[k][2],0)/3});}faces.sort((a,b)=>a.z-b.z);c.lineWidth=.6;for(let f of faces){c.beginPath();f.p.forEach((p,k)=>k?c.lineTo(r.width/2+p[0]*scale,r.height/2+p[1]*scale):c.moveTo(r.width/2+p[0]*scale,r.height/2+p[1]*scale));c.closePath();c.globalAlpha=+$('alpha').value;c.fillStyle=f.phase===1?'#cd8f4d':f.phase===2?'#397b84':`hsl(${f.phase*137.508%360} 50% 55%)`;c.fill();c.globalAlpha=.75;c.strokeStyle='#21485e';c.stroke();}document.body.dataset.rendered='true';document.body.dataset.cells=D.cells.length;}
for(let id of ['shrink','alpha'])$(id).oninput=draw;$('mesh').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('mesh').setPointerCapture(e.pointerId);};$('mesh').onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;draw();});}};$('mesh').onpointerup=()=>drag=null;window.addEventListener('resize',draw);draw();</script></html>
